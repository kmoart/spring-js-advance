version: '3.9'

services:

  app:
    build: .
    container_name: spring_app
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:13
    container_name: postgres13_db
    restart: always
    environment:
      POSTGRES_DB: practicajaveriana
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5433:5432"